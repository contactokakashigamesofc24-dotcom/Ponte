name: Build full Ponte client

on:
  workflow_dispatch:
  push:
    branches: [ponte-fullclient-build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Ponte repository (for permanent signing and release)
        uses: actions/checkout@v4
      - name: Checkout full Element X-derived client source
        uses: actions/checkout@v4
        with:
          repository: contactokakashigamesofc24-dotcom/Ponte-ElementX
          ref: ponte-migration
          path: ElementX
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Prepare Ponte permanent signing key
        env:
          PONTE_SIGNING_KEYSTORE_B64: ${{ secrets.PONTE_SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$PONTE_SIGNING_KEYSTORE_B64"
          printf '%s' "$PONTE_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ponte-release.p12"
          chmod 600 "$RUNNER_TEMP/ponte-release.p12"
          echo "PONTE_SIGNING_KEYSTORE=$RUNNER_TEMP/ponte-release.p12" >> "$GITHUB_ENV"
      - name: Build complete Matrix client
        working-directory: ElementX
        env:
          PONTE_SIGNING_PASSWORD: ${{ secrets.PONTE_SIGNING_PASSWORD }}
          PONTE_SIGNING_ALIAS: ${{ secrets.PONTE_SIGNING_ALIAS }}
        run: |
          test -n "$PONTE_SIGNING_PASSWORD"
          test -n "$PONTE_SIGNING_ALIAS"
          ./gradlew --no-daemon :app:assembleFdroidRelease --stacktrace
      - name: Verify app ID and permanent signature
        run: |
          APK=$(find ElementX/app/build/outputs/apk/fdroid/release -type f -name '*universal-release.apk' | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.luizfernando.ponte'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/Ponte-full-client.apk
      - name: Record source commit
        id: source
        run: echo "sha=$(git -C ElementX rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload signed full-client APK
        uses: actions/upload-artifact@v4
        with:
          name: Ponte-full-client-signed
          path: dist/Ponte-full-client.apk
          retention-days: 14
      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ponte-fullclient-${GITHUB_RUN_NUMBER}-2026-11-27"
          gh release create "$TAG" dist/Ponte-full-client.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Ponte — cliente Matrix completo (prévia ${GITHUB_RUN_NUMBER})" \
            --notes "Cliente completo baseado no Element X Android, reidentificado como Ponte. Código-fonte do fork: https://github.com/contactokakashigamesofc24-dotcom/Ponte-ElementX/tree/ponte-migration (commit ${{ steps.source.outputs.sha }}). Distribuição sob AGPL-3.0; avisos/licença devem ser mantidos. Assinado com a chave permanente do Ponte. A sessão local do protótipo e o estado das chaves E2EE precisam ser validados no aparelho; este build ainda não foi testado por Luiz." \
            --prerelease
