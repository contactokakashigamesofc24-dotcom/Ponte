name: Compilar app Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Compilar APK de teste
        run: gradle --no-daemon assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ponte-prototipo-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Publicar APK de demonstração
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ponte-prototipo-0.1.0-2026-11-27 app/build/outputs/apk/debug/app-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
