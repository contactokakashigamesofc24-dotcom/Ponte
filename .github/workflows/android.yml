name: Compilar app Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Preparar chave permanente
        env:
          PONTE_SIGNING_KEYSTORE_B64: ${{ secrets.PONTE_SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$PONTE_SIGNING_KEYSTORE_B64"
          printf '%s' "$PONTE_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ponte-release.p12"
          chmod 600 "$RUNNER_TEMP/ponte-release.p12"
          echo "PONTE_SIGNING_KEYSTORE=$RUNNER_TEMP/ponte-release.p12" >> "$GITHUB_ENV"
      - name: Compilar APK assinado
        env:
          PONTE_SIGNING_PASSWORD: ${{ secrets.PONTE_SIGNING_PASSWORD }}
          PONTE_SIGNING_ALIAS: ${{ secrets.PONTE_SIGNING_ALIAS }}
        run: |
          test -n "$PONTE_SIGNING_PASSWORD"
          test -n "$PONTE_SIGNING_ALIAS"
          gradle --no-daemon assembleDebug
      - name: Verificar assinatura do APK
        run: /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ponte-0.2.7-assinado
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Publicar APK assinado
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create ponte-0.2.7-2026-11-27 app/build/outputs/apk/debug/app-debug.apk
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "Ponte 0.2.7 — diagnóstico de login Matrix"
          --notes 'Mantém o componente Android rustls-platform-verifier e a validação TLS. Melhora a tela de erro de login para mostrar a causa/código devolvido pelo servidor, ocultando termos de segredo, mantém o ID de usuário preenchido e limpa o campo de senha quando a autenticação falha. Assinado com chave permanente; login Matrix ainda precisa de teste no aparelho.'
          --prerelease
